name: 📊 WakaTime Stats Sync

on:
  schedule:
    # Run every 6 hours
    - cron: "0 */6 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  update-readme:
    name: Update WakaTime Weekly Stats
    runs-on: ubuntu-latest
    steps:
      - uses: anmol00000/waka-readme-stats@master
        with:
          WAKATIME_API_KEY: ${{ secrets.WAKATIME_API_KEY }}
          SHOW_TIME: "true"
          SHOW_TOTAL: "true"
          SHOW_PROJECTS: "true"
          SHOW_LANGUAGES: "true"
          SHOW_EDITORS: "true"
          SHOW_DAYS_OF_WEEK: "true"
          SHOW_PROFILE_VIEWS: "false"
          SHOW_SHORT_INFO: "true"
          SHOW_LOC_CHART: "true"
          SECTION_NAME: "wakatime"
